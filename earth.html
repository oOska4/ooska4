<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Mapa 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; overflow: hidden; font-family: monospace; }
#c { display: block; width: 100vw; height: 100vh; }
#hud {

</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="h-pos">Lat: 50.855  Lon: 16.710</div>
  <div id="h-alt">Wysokość kamery: —</div>
  <div id="h-tiles">Tile'y: ładowanie...</div>
</div>
<div id="teleport">
  <button onclick="teleportTo(47.030, 10.746, 25000)">🏔 Kaunertal</button>
  <button onclick="teleportTo(51.107, 17.038, 25000)">🏙 Wrocław</button>
</div>
<div id="ctrl">LPM drag = obracaj · scroll = zoom · PPM drag = przesuwaj</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── STAŁE ────────────────────────────────────────────────────────────────────
const EXAG = 3.0;
const Y_SCALE = 0.4;
const BUILDING_HEIGHT_SCALE = 1.4;
const TILE_LOAD_SIZE = 9;
const TILE_LOAD_RADIUS = Math.floor(TILE_LOAD_SIZE / 2);
const WASD_SPEED = 30;
const QE_SPEED   = 30;

// GRID adaptacyjny – daleko mniej wierzchołków, blisko więcej szczegółów
function gridForZoom(z) {
  if (z <= 9)  return 48;
  if (z <= 11) return 80;
  if (z <= 13) return 112;
  return 128;
}

const BUILDINGS_ENABLED        = true;
const BUILDINGS_TILE_ZOOM      = 15;
const BUILDINGS_TILE_RADIUS    = 2;
const BUILDINGS_MAX_DIST       = 80000;
const BUILDINGS_MIN_DIST       = 500;
const BUILDINGS_REQUEST_TIMEOUT_MS = 12000;
const BUILDINGS_DATA_KEY       = '59fcc2e8';
const BUILDINGS_TILE_SUBDOMAINS = ['a', 'b', 'c'];
const BUILDINGS_TILE_URLS      = BUILDINGS_TILE_SUBDOMAINS.map(s =>
  `https://${s}.data.osmbuildings.org/0.2/${BUILDINGS_DATA_KEY}/tile/{z}/{x}/{y}.json`
);
// Ile batoched-tile-meshów trzymamy w scenie
const BUILDINGS_SCENE_TILE_LIMIT = 6;
// Ile wpisów w cache danych trzymamy
const BUILDINGS_DATA_CACHE_LIMIT = 14;
const BUILDINGS_DEBUG = true;

// SAT zoom do próbkowania koloru budynków – taki sam jak maksymalny zoom terenu,
// żeby tile'y były już w cache z pipeline terenu
const COLOR_SAT_ZOOM = 15;

// ─── URL helpers ──────────────────────────────────────────────────────────────
const SAT  = (z,x,y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`;
const SAT2 = (z,x,y) =>
  `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;
const DEM  = (z,x,y) =>
  `https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${x}/${y}.png`;

// ─── GEO helpers ──────────────────────────────────────────────────────────────
function deg2tile(lat, lon, z) {
  const n = 1 << z, lr = lat * Math.PI / 180;
  return [
    Math.floor((lon + 180) / 360 * n),
    Math.floor((1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n)
  ];
}
function tile2deg(tx, ty, z) {
  const n = 1 << z;
  return [
    Math.atan(Math.sinh(Math.PI * (1 - 2 * ty / n))) * 180 / Math.PI,
    tx / n * 360 - 180
  ];
}
function latLonToWorld(lat, lon) {
  const R = 6371000, mid = refLat * Math.PI / 180;
  return [
    (lon - refLon) * Math.PI / 180 * R * Math.cos(mid),
    (lat - refLat) * Math.PI / 180 * R
  ];
}
function polygonCenter(points) {
  let lat = 0, lon = 0;
  for (const p of points) { lat += p[0]; lon += p[1]; }
  return [lat / points.length, lon / points.length];
}

// ─── THREE setup ──────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById('c'),
  antialias: false,
  powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = null;

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 100, 3000000);

// MeshBasicMaterial nie używa świateł – zostawiamy tylko ambient dla budynków (Lambert)
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(100000, 150000, 80000);
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

// ─── Kamera ───────────────────────────────────────────────────────────────────
let camLat = 47.03012, camLon = 10.74558, camDist = 120000;
let camPitch = 45, camYaw = 0, camY = 0;
const refLat = 47.03012, refLon = 10.74558;

// ─── TERRAIN tiles ────────────────────────────────────────────────────────────
const tileMeshes    = new Map();
const loadingTiles  = new Set();
let activeTileZoom  = null;
let tileLoadController = new AbortController();
let tileLoadEpoch   = 0;
const demDataCache  = new Map();
const DEM_DATA_CACHE_LIMIT = 64;

// ─── SAT texture cache (dla terenu) ───────────────────────────────────────────
const SAT_TEXTURE_CACHE_LIMIT = 32;
const satTextureCache = new Map();  // cacheKey → THREE.Texture
const satTextureCacheKeys = new WeakMap();  // texture → cacheKey

function getCachedSatTexture(key) {
  if (!satTextureCache.has(key)) return null;
  const t = satTextureCache.get(key);
  satTextureCache.delete(key); satTextureCache.set(key, t); // LRU bump
  return t;
}
function putCachedSatTexture(key, t) {
  satTextureCacheKeys.set(t, key);
  satTextureCache.set(key, t);
  while (satTextureCache.size > SAT_TEXTURE_CACHE_LIMIT) {
    const k = satTextureCache.keys().next().value;
    satTextureCache.delete(k);
  }
}

// ─── TilePixelStore ───────────────────────────────────────────────────────────
// Promise coalescing: ten sam tile → jedna wspólna Promise (zero duplikatów).
// Po resolve: lookup = array[offset] → O(1), zero DOM/canvas per budynek.
const COLOR_PIXEL_CACHE_LIMIT = 256;
const colorPixelCache    = new Map(); // key → Uint8ClampedArray
const colorPixelInflight = new Map(); // key → Promise<Uint8ClampedArray|null>

async function loadImageBlob(url, signal) {
  try {
    const r = await fetch(url, { mode: 'cors', signal });
    if (!r.ok) return null;
    return URL.createObjectURL(await r.blob());
  } catch { return null; }
}

function _blobToPixels(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const cv2 = document.createElement('canvas');
        cv2.width = cv2.height = 256;
        const ctx = cv2.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, 256, 256);
        res(ctx.getImageData(0, 0, 256, 256).data);
      } catch { res(null); }
      URL.revokeObjectURL(src);
    };
    img.onerror = () => { URL.revokeObjectURL(src); res(null); };
    img.crossOrigin = 'anonymous';
    img.src = src;
  });
}

// Zwraca Promise<Uint8ClampedArray|null> – zawsze ta sama instancja dla danego tile'a.
function loadTilePixels(z, x, y, signal) {
  const key = `${z}_${x}_${y}`;
  if (colorPixelCache.has(key)) return Promise.resolve(colorPixelCache.get(key));
  if (colorPixelInflight.has(key)) return colorPixelInflight.get(key);
  const p = (async () => {
    for (const url of [SAT2(z, x, y), SAT(z, x, y)]) {
      if (signal?.aborted) return null;
      const src = await loadImageBlob(url, signal);
      if (!src) continue;
      const pixels = await _blobToPixels(src);
      if (pixels) {
        colorPixelCache.set(key, pixels);
        while (colorPixelCache.size > COLOR_PIXEL_CACHE_LIMIT)
          colorPixelCache.delete(colorPixelCache.keys().next().value);
        colorPixelInflight.delete(key);
        return pixels;
      }
    }
    colorPixelInflight.delete(key);
    return null;
  })();
  colorPixelInflight.set(key, p);
  return p;
}

// Oblicz tile + pixel offset (synchronicznie) – potrzebne do prefetchu i lookup
function latLonToTilePixel(lat, lon, z) {
  const n = 1 << z;
  const lr = lat * Math.PI / 180;
  const xf = (lon + 180) / 360 * n;
  const yf = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
  const tx = Math.floor(xf), ty = Math.floor(yf);
  return {
    tx, ty,
    px: Math.max(0, Math.min(255, Math.floor((xf - tx) * 256))),
    py: Math.max(0, Math.min(255, Math.floor((yf - ty) * 256)))
  };
}

// Synchroniczne próbkowanie koloru z już załadowanego bufora
function samplePixelColor(pixels, px, py) {
  if (!pixels) return 0xb7b0a6;
  const i = (py * 256 + px) * 4;
  return (pixels[i] << 16) | (pixels[i + 1] << 8) | pixels[i + 2];
}

// Synchroniczne próbkowanie wysokości z już załadowanego DEM
function sampleDemHeight(dem, lat, lon, zoom) {
  if (!dem) return 0;
  const n = 1 << zoom;
  const lr = lat * Math.PI / 180;
  const xf = (lon + 180) / 360 * n;
  const yf = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
  const px = Math.max(0, Math.min(255, Math.floor((xf - Math.floor(xf)) * 255)));
  const py = Math.max(0, Math.min(255, Math.floor((yf - Math.floor(yf)) * 255)));
  return Math.max(0, dem[py * 256 + px]) * EXAG * Y_SCALE;
}

// Async – tylko dla terenu
async function groundColorAt(lat, lon, signal) {
  const { tx, ty, px, py } = latLonToTilePixel(lat, lon, COLOR_SAT_ZOOM);
  const pixels = await loadTilePixels(COLOR_SAT_ZOOM, tx, ty, signal);
  return samplePixelColor(pixels, px, py);
}

// ─── SAT texture dla terenu ───────────────────────────────────────────────────
async function loadSatTex(z, x, y, signal) {
  const key = `${z}_${x}_${y}`;
  const cached = getCachedSatTexture(key);
  if (cached) return cached;
  for (const url of [SAT2(z, x, y), SAT(z, x, y)]) {
    const src = await loadImageBlob(url, signal);
    if (!src) continue;
    const result = await new Promise(res => {
      const img = new Image();
      img.onload = () => {
        // Rysuj na canvasie raz – wyciągnij i pixel data (CPU) i teksturę (GPU)
        const cv2 = document.createElement('canvas');
        cv2.width = cv2.height = 256;
        const ctx = cv2.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, 256, 256);

        // Pixel data do colorPixelCache
        try {
          const pixels = ctx.getImageData(0, 0, 256, 256).data;
          if (!colorPixelCache.has(key)) {
            colorPixelCache.set(key, pixels);
            while (colorPixelCache.size > COLOR_PIXEL_CACHE_LIMIT)
              colorPixelCache.delete(colorPixelCache.keys().next().value);
          }
        } catch(e) { /* tainted canvas – ignoruj */ }

        // Tekstura Three.js z tego samego obrazu
        const tex = new THREE.CanvasTexture(cv2);
        tex.wrapS     = THREE.ClampToEdgeWrapping;
        tex.wrapT     = THREE.ClampToEdgeWrapping;
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        URL.revokeObjectURL(src);
        res(tex);
      };
      img.onerror = () => { URL.revokeObjectURL(src); res(null); };
      img.crossOrigin = 'anonymous';
      img.src = src;
    });
    if (result) { putCachedSatTexture(key, result); return result; }
  }
  return null;
}

// ─── DEM ──────────────────────────────────────────────────────────────────────
async function decodeDEM(url, signal) {
  const src = await loadImageBlob(url, signal);
  if (!src) return null;
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try {
        const cv2 = document.createElement('canvas');
        cv2.width = cv2.height = 256;
        const ctx = cv2.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const px = ctx.getImageData(0, 0, 256, 256).data;
        const h = new Float32Array(256 * 256);
        for (let i = 0; i < 256 * 256; i++)
          h[i] = px[i * 4] * 256 + px[i * 4 + 1] + px[i * 4 + 2] / 256 - 32768;

        // ── Spike filter ──────────────────────────────────────────────────────
        // Dla każdego piksela (z pominięciem krawędzi): jeśli wartość odstaje od
        // średniej 4 sąsiadów o więcej niż SPIKE_THRESHOLD metrów, zastąp ją
        // tą średnią. Eliminuje pojedyncze błędne piksele DEM bez wpływu na
        // prawdziwe szczyty (które mają spójne sąsiedztwo).
        const SPIKE_THRESHOLD = 200; // metry – większe różnice to błąd danych
        for (let y = 1; y < 255; y++) {
          for (let x = 1; x < 255; x++) {
            const i   = y * 256 + x;
            const avg = (h[i - 1] + h[i + 1] + h[i - 256] + h[i + 256]) * 0.25;
            if (Math.abs(h[i] - avg) > SPIKE_THRESHOLD) h[i] = avg;
          }
        }

        URL.revokeObjectURL(src);
        res(h);
      } catch { res(null); }
    };
    img.onerror = () => { URL.revokeObjectURL(src); res(null); };
    img.src = src;
  });
}
const demInflight = new Map();
function loadDemData(z, x, y, signal) {
  const key = `${z}_${x}_${y}`;
  if (demDataCache.has(key)) return Promise.resolve(demDataCache.get(key));
  if (demInflight.has(key)) return demInflight.get(key);
  const p = (async () => {
    const dem = await decodeDEM(DEM(z, x, y), signal);
    demInflight.delete(key);
    if (dem) {
      demDataCache.set(key, dem);
      while (demDataCache.size > DEM_DATA_CACHE_LIMIT)
        demDataCache.delete(demDataCache.keys().next().value);
    }
    return dem;
  })();
  demInflight.set(key, p);
  return p;
}

async function terrainHeightAt(lat, lon, zoom, signal) {
  const n = 1 << zoom;
  const lr = lat * Math.PI / 180;
  const xf = (lon + 180) / 360 * n;
  const yf = (1 - Math.log(Math.tan(lr) + 1 / Math.cos(lr)) / Math.PI) / 2 * n;
  const tx = Math.floor(xf), ty = Math.floor(yf);
  const dem = await loadDemData(zoom, tx, ty, signal);
  if (!dem) return 0;
  const px = Math.max(0, Math.min(255, Math.floor((xf - tx) * 255)));
  const py = Math.max(0, Math.min(255, Math.floor((yf - ty) * 255)));
  return Math.max(0, dem[py * 256 + px]) * EXAG * Y_SCALE;
}

// ─── SEAM FIX: sąsiednie DEM ──────────────────────────────────────────────────
function sampleHeightWithNeighbors(u, v, dem, demR, demB, demC) {
  const EPS = 1.0 / 256;
  let d = dem, su = u, sv = v;
  if (u >= 1.0 - EPS && demR) {
    d = demR; su = u - 1.0; sv = v;
    if (sv >= 1.0 - EPS && demC) { d = demC; su = u - 1.0; sv = v - 1.0; }
  } else if (v >= 1.0 - EPS && demB) {
    d = demB; su = u; sv = v - 1.0;
  }
  if (!d) return 0;
  const px = Math.max(0, Math.min(255, Math.floor(Math.max(0, su) * 255)));
  const py = Math.max(0, Math.min(255, Math.floor(Math.max(0, sv) * 255)));
  return Math.max(0, d[py * 256 + px]) * EXAG;
}

// ─── BUILDINGS – batched geometry ─────────────────────────────────────────────
// Budynki w jednym tile są łączone w JEDEN Mesh z vertex colors.
// Brak osobnych materialów per budynek → ogromna oszczędność draw calls.

// Material budynków – Basic zamiast Lambert: kolor vertex bez oświetlenia,
// zero problemów z normalnymi/białością przy złym windingu GeoJSON
const buildingMaterial = new THREE.MeshBasicMaterial({
  vertexColors: true,
  side: THREE.FrontSide
});

// tileKey → THREE.Mesh (batch)
const buildingMeshes   = new Map();
const buildingTileOrder = [];
// tileKey → Array<{id, points, height, baseY, colorHex}>
const buildingCache    = new Map();
let lastBuildingTileKey = null;
let buildingLoadController = new AbortController();
let buildingLoadEpoch  = 0;

function evictBuildingTile(tileKey) {
  const mesh = buildingMeshes.get(tileKey);
  if (!mesh) return;
  scene.remove(mesh);
  mesh.geometry.dispose();
  buildingMeshes.delete(tileKey);
  const idx = buildingTileOrder.indexOf(tileKey);
  if (idx !== -1) buildingTileOrder.splice(idx, 1);
}
function clearAllBuildingTiles() {
  for (const k of [...buildingMeshes.keys()]) evictBuildingTile(k);
}
function registerBuildingTile(tileKey, mesh) {
  if (buildingMeshes.has(tileKey)) evictBuildingTile(tileKey);
  buildingMeshes.set(tileKey, mesh);
  buildingTileOrder.push(tileKey);
  while (buildingTileOrder.length > BUILDINGS_SCENE_TILE_LIMIT) {
    evictBuildingTile(buildingTileOrder[0]);
  }
}
function putBuildingCache(tileKey, items) {
  if (buildingCache.has(tileKey)) buildingCache.delete(tileKey);
  buildingCache.set(tileKey, items);
  while (buildingCache.size > BUILDINGS_DATA_CACHE_LIMIT)
    buildingCache.delete(buildingCache.keys().next().value);
}

// ─── Extruduj jeden budynek do tablic pos/col/idx ─────────────────────────────
function extrudeBuildingInto(positions, colors, indices, points, height, baseY, colorHex) {
  if (!points || points.length < 3) return;

  const r = ((colorHex >> 16) & 0xff) / 255;
  const g = ((colorHex >>  8) & 0xff) / 255;
  const b = ( colorHex        & 0xff) / 255;

  // Wysokość budynku musi być w tych samych jednostkach co Y terenu.
  // Teren: dem_metry * EXAG * Y_SCALE. Budynki: metry * Y_SCALE (bez EXAG –
  // EXAG dotyczy tylko rzeźby terenu, nie obiektów na nim).
  const scaledHeight = Math.max(1, height) * Y_SCALE;

  // Dolna krawędź budynku zanurzona minimalnie poniżej baseY, żeby nie było
  // szczelin między budynkiem a terenem gdy teren jest nieregularny.
  const bottomY = baseY - 1.0;
  const topY    = baseY + scaledHeight;

  const base = positions.length / 3;
  const n = points.length;
  const worldPts = points.map(p => latLonToWorld(p[0], p[1]));

  // Bottom ring (zagłębiony w teren – niewidoczny, zapobiega szczelinom)
  for (const [wx, wz] of worldPts) {
    positions.push(wx, bottomY, -wz);
    colors.push(r * 0.4, g * 0.4, b * 0.4);
  }
  // Top ring
  for (const [wx, wz] of worldPts) {
    positions.push(wx, topY, -wz);
    colors.push(r, g, b);
  }
  // Roof center
  let cx = 0, cz = 0;
  for (const [wx, wz] of worldPts) { cx += wx; cz += wz; }
  cx /= n; cz /= n;
  const roofIdx = base + 2 * n;
  positions.push(cx, topY, -cz);
  colors.push(Math.min(1, r * 1.15), Math.min(1, g * 1.15), Math.min(1, b * 1.15));

  // Side faces
  for (let i = 0; i < n; i++) {
    const j  = (i + 1) % n;
    const b0 = base + i,     b1 = base + j;
    const t0 = base + n + i, t1 = base + n + j;
    indices.push(b0, b1, t1,  b0, t1, t0);
  }
  // Roof fan
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n;
    indices.push(roofIdx, base + n + i, base + n + j);
  }
}

// Buduje jeden THREE.Mesh ze wszystkich budynków w tablicy items
function buildBatchedMesh(items) {
  const positions = [], colors = [], indices = [];
  for (const item of items) {
    extrudeBuildingInto(positions, colors, indices,
      item.points, item.height, item.baseY, item.colorHex);
  }
  if (positions.length === 0) return null;

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(new Float32Array(colors), 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, buildingMaterial);
}

// ─── Building loading pipeline ────────────────────────────────────────────────
async function fetchJsonWithTimeout(url, signal, ms = BUILDINGS_REQUEST_TIMEOUT_MS) {
  const tc = new AbortController();
  const tid = setTimeout(() => tc.abort(), ms);
  signal.addEventListener('abort', () => tc.abort(), { once: true });
  try {
    const r = await fetch(url, { method: 'GET', mode: 'cors', signal: tc.signal });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) {
    if (signal.aborted) throw e;
    if (e?.name === 'AbortError') return null;
    throw e;
  } finally {
    clearTimeout(tid);
  }
}

function geoRingToLatLon(ring) {
  const pts = [];
  for (const c of ring || []) {
    if (!Array.isArray(c) || c.length < 2) continue;
    pts.push([c[1], c[0]]);
  }
  if (pts.length > 1) {
    const f = pts[0], l = pts[pts.length - 1];
    if (f[0] === l[0] && f[1] === l[1]) pts.pop();
  }
  return pts;
}
function parseBuildingHeight(tags) {
  if (tags?.height) {
    const h = parseFloat(String(tags.height).replace(',', '.'));
    if (Number.isFinite(h) && h > 0) return h;
  }
  if (tags?.['building:levels']) {
    const lv = parseFloat(String(tags['building:levels']).replace(',', '.'));
    if (Number.isFinite(lv) && lv > 0) return Math.max(4, lv * 3);
  }
  return 8;
}

// Kolor budynku: deterministyczny hash ID → naturalny kolor miejski w HSL.
// Hue: ciepłe odcienie (0-60° żółto-czerwone) + chłodne szarości (180-240°)
// Saturation: niska (miasto = wyblakłe kolory)
// Lightness: średnia-wysoka (jasne elewacje)
function buildingColor(id) {
  let h = 0;
  for (let i = 0; i < id.length; i++) h = (Math.imul(31, h) + id.charCodeAt(i)) | 0;
  const u = (h >>> 0) / 0xffffffff; // [0,1] unsigned

  // Podziel na 3 strefy hue: ciepłe (ceglane/beżowe), neutralne (szare), chłodne (kamienne)
  const hueRanges = [[15, 45], [25, 55], [200, 230], [30, 50], [10, 40]];
  const range = hueRanges[Math.abs(h) % hueRanges.length];
  const hue = range[0] + ((h >> 8) & 0xff) / 255 * (range[1] - range[0]);
  const sat = 8 + ((h >> 16) & 0xff) / 255 * 22;   // 8–30% – wyblakłe
  const lit = 52 + ((h >> 4)  & 0xff) / 255 * 28;  // 52–80% – jasne elewacje

  // HSL → RGB
  const s = sat / 100, l = lit / 100;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((hue / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if      (hue < 60)  { r=c; g=x; b=0; }
  else if (hue < 120) { r=x; g=c; b=0; }
  else if (hue < 180) { r=0; g=c; b=x; }
  else if (hue < 240) { r=0; g=x; b=c; }
  else if (hue < 300) { r=x; g=0; b=c; }
  else                { r=c; g=0; b=x; }
  return (Math.round((r+m)*255) << 16) | (Math.round((g+m)*255) << 8) | Math.round((b+m)*255);
}

async function loadBuildings(lat, lon) {
  const shouldShow = BUILDINGS_ENABLED &&
    camDist <= BUILDINGS_MAX_DIST && camDist >= BUILDINGS_MIN_DIST;

  if (!shouldShow) {
    if (buildingMeshes.size > 0) { clearAllBuildingTiles(); lastBuildingTileKey = null; }
    return;
  }

  const [cx, cy] = deg2tile(lat, lon, BUILDINGS_TILE_ZOOM);
  const buildingKey = `${BUILDINGS_TILE_ZOOM}_${cx}_${cy}`;

  if (buildingKey === lastBuildingTileKey && buildingMeshes.has(buildingKey)) return;
  lastBuildingTileKey = buildingKey;

  buildingLoadController.abort();
  buildingLoadController = new AbortController();
  buildingLoadEpoch++;
  const epoch = buildingLoadEpoch;
  const sig   = buildingLoadController.signal;

  // Cache hit → odbuduj mesh synchronicznie
  if (buildingCache.has(buildingKey)) {
    const cached = buildingCache.get(buildingKey);
    buildingCache.delete(buildingKey); buildingCache.set(buildingKey, cached);
    const mesh = buildBatchedMesh(cached);
    if (mesh) { scene.add(mesh); registerBuildingTile(buildingKey, mesh); }
    if (BUILDINGS_DEBUG) console.log('[buildings] cache hit', buildingKey, cached.length);
    return;
  }

  try {
    // ── FAZA 1: pobierz JSON wszystkich tile'ów budynków równolegle ──────────
    const tileCoords = [];
    for (let dy = -BUILDINGS_TILE_RADIUS; dy <= BUILDINGS_TILE_RADIUS; dy++)
      for (let dx = -BUILDINGS_TILE_RADIUS; dx <= BUILDINGS_TILE_RADIUS; dx++)
        tileCoords.push([cx + dx, cy + dy]);

    const fetchOneTileJson = async ([tx, ty]) => {
      for (const urlTpl of BUILDINGS_TILE_URLS) {
        const url = urlTpl.replace('{z}', BUILDINGS_TILE_ZOOM)
                          .replace('{x}', tx).replace('{y}', ty);
        let data;
        try { data = await fetchJsonWithTimeout(url, sig); }
        catch (e) { if (e?.name === 'AbortError') throw e; continue; }
        if (data) return { tx, ty, data };
      }
      return null;
    };

    const jsonResults = await Promise.all(tileCoords.map(fetchOneTileJson));
    if (epoch !== buildingLoadEpoch || sig.aborted) return;

    // ── FAZA 2: z JSON wyciągnij centra wszystkich budynków ──────────────────
    // Zbierz unikalne tile DEM i SAT, które będą potrzebne
    const rawBuildings = []; // { tx, ty, id, ring, height }
    for (const res of jsonResults) {
      if (!res) continue;
      const { tx, ty, data } = res;
      const features = Array.isArray(data.features) ? data.features : [];
      let li = 0;
      for (const feature of features) {
        const props  = feature.properties || {};
        const height = parseBuildingHeight(props) * BUILDING_HEIGHT_SCALE;
        const geom   = feature.geometry || {};
        const parts  = [];
        if      (geom.type === 'Polygon')      parts.push(geom.coordinates);
        else if (geom.type === 'MultiPolygon') parts.push(...geom.coordinates);
        else continue;
        for (const poly of parts) {
          if (!poly?.length || !poly[0] || poly[0].length < 3) continue;
          const ring = geoRingToLatLon(poly[0]);
          if (ring.length < 3) continue;
          rawBuildings.push({
            id: `b_${tx}_${ty}_${feature.id ?? (props.osm_id ?? li++)}`,
            ring, height,
            center: polygonCenter(ring)
          });
        }
      }
    }
    if (epoch !== buildingLoadEpoch || sig.aborted) return;

    // ── FAZA 3: prefetch DEM + SAT pixel tile'ów ─────────────────────────────
    // SAT zoom = activeTileZoom – te tile'y są już w colorPixelCache z loadSatTex.
    // loadTilePixels ma promise coalescing – nie robi duplikatów requestów.
    const satZ = activeTileZoom ?? COLOR_SAT_ZOOM;
    const demTileKeys = new Set();
    const satTileKeys = new Set();
    for (const b of rawBuildings) {
      const [clat, clon] = b.center;
      const [dtx, dty] = deg2tile(clat, clon, BUILDINGS_TILE_ZOOM);
      demTileKeys.add(`${BUILDINGS_TILE_ZOOM}_${dtx}_${dty}`);
      const { tx: stx, ty: sty } = latLonToTilePixel(clat, clon, satZ);
      satTileKeys.add(`${satZ}_${stx}_${sty}`);
    }
    await Promise.all([
      ...[...demTileKeys].map(k => { const [z,x,y] = k.split('_').map(Number); return loadDemData(z,x,y,sig); }),
      ...[...satTileKeys].map(k => { const [z,x,y] = k.split('_').map(Number); return loadTilePixels(z,x,y,sig); }),
    ]);
    if (epoch !== buildingLoadEpoch || sig.aborted) return;

    // ── FAZA 4: SYNCHRONICZNA pętla po budynkach ──────────────────────────────
    const items = [];
    for (const b of rawBuildings) {
      const [clat, clon] = b.center;

      // DEM lookup – pomiń gdy brak (unikamy kopii na Y=0)
      const [dtx, dty] = deg2tile(clat, clon, BUILDINGS_TILE_ZOOM);
      const dem = demDataCache.get(`${BUILDINGS_TILE_ZOOM}_${dtx}_${dty}`) ?? null;
      if (!dem) continue;
      const baseY = sampleDemHeight(dem, clat, clon, BUILDINGS_TILE_ZOOM);

      // SAT kolor – z pixel cache załadowanego przez terrain pipeline
      const { tx: stx, ty: sty, px, py } = latLonToTilePixel(clat, clon, satZ);
      const pixels   = colorPixelCache.get(`${satZ}_${stx}_${sty}`) ?? null;
      const colorHex = pixels ? samplePixelColor(pixels, px, py) : buildingColor(b.id);

      items.push({ id: b.id, points: b.ring, height: b.height, baseY, colorHex });
    }

    putBuildingCache(buildingKey, items);
    const mesh = buildBatchedMesh(items);
    if (mesh) { scene.add(mesh); registerBuildingTile(buildingKey, mesh); }

    if (BUILDINGS_DEBUG)
      console.log('[buildings] loaded', items.length, 'buildings |',
        demTileKeys.size, 'dem tiles |', satTileKeys.size, 'sat tiles | scene:',
        buildingTileOrder.length, '| cache:', buildingCache.size);
  } catch (e) {
    if (BUILDINGS_DEBUG && e?.name !== 'AbortError') console.error('[buildings]', e);
  }
}

// ─── TERRAIN mesh ─────────────────────────────────────────────────────────────
// Prealokowane bufory robocze – największy możliwy GRID=128 → (129)²=16641 werteksów
const _MAX_G   = 128;
const _MAX_G1  = _MAX_G + 1;
const _posBuf  = new Float32Array(_MAX_G1 * _MAX_G1 * 3);
const _uvBuf   = new Float32Array(_MAX_G1 * _MAX_G1 * 2);

// Cache index bufferów per GRID – budowane raz, potem reużywane (SharedBuffer trick)
const _idxCache = new Map(); // GRID → Uint32Array
function getIdxBuf(G) {
  if (_idxCache.has(G)) return _idxCache.get(G);
  const G1  = G + 1;
  const buf = new Uint32Array(G * G * 6);
  let i = 0;
  for (let r = 0; r < G; r++)
    for (let c = 0; c < G; c++) {
      const v = r * G1 + c;
      buf[i++] = v;     buf[i++] = v + G1;     buf[i++] = v + G1 + 1;
      buf[i++] = v;     buf[i++] = v + G1 + 1; buf[i++] = v + 1;
    }
  _idxCache.set(G, buf);
  return buf;
}

async function buildMeshWithNeighbors(tx, ty, zoom, signal) {
  const [dem, demR, demB, demC] = await Promise.all([
    loadDemData(zoom, tx,     ty,     signal),
    loadDemData(zoom, tx + 1, ty,     signal),
    loadDemData(zoom, tx,     ty + 1, signal),
    loadDemData(zoom, tx + 1, ty + 1, signal),
  ]);

  const GRID  = gridForZoom(zoom);
  const G1    = GRID + 1;
  const INV_G = 1 / GRID;

  const [lat1, lon1] = tile2deg(tx,   ty,   zoom);
  const [lat2, lon2] = tile2deg(tx+1, ty+1, zoom);
  const R    = 6371000, mid = refLat * Math.PI / 180;
  const cosM = Math.cos(mid);
  const x0   = (lon1 - refLon) * Math.PI / 180 * R * cosM;
  const y0   = (lat1 - refLat) * Math.PI / 180 * R;
  const dx   = (lon2 - lon1)   * Math.PI / 180 * R * cosM;
  const dy   = (lat2 - lat1)   * Math.PI / 180 * R;

  const UV_INSET = 0.5 / 256;
  const UV_SCALE = 1 - 2 * UV_INSET;
  const EPS      = 1.0 / 256;

  let vi = 0, ui = 0;
  for (let r = 0; r <= GRID; r++) {
    for (let c = 0; c <= GRID; c++) {
      const u = c * INV_G;
      const v = r * INV_G;
      let wz = 0;
      if (dem) {
        let d = dem, su = u, sv = v;
        if      (u >= 1.0 - EPS && demR) { d = demR; su = u - 1.0; sv = v;
          if    (sv >= 1.0 - EPS && demC) { d = demC; su = u - 1.0; sv = v - 1.0; }
        } else if (v >= 1.0 - EPS && demB) { d = demB; su = u; sv = v - 1.0; }
        const px  = su < 0 ? 0 : su > 1 ? 255 : (su * 255) | 0;
        const py  = sv < 0 ? 0 : sv > 1 ? 255 : (sv * 255) | 0;
        const raw = d[py * 256 + px];
        wz = raw > 0 ? raw * EXAG * Y_SCALE : 0;
      }
      _posBuf[vi++] = x0 + u * dx;
      _posBuf[vi++] = wz;
      _posBuf[vi++] = -(y0 + v * dy);
      _uvBuf[ui++]  = UV_INSET + u * UV_SCALE;
      _uvBuf[ui++]  = UV_INSET + (1 - v) * UV_SCALE;
    }
  }

  const idxBuf = getIdxBuf(GRID); // shared – nie kopiujemy, THREE dostaje widok
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(_posBuf.slice(0, vi), 3));
  geo.setAttribute('uv',       new THREE.BufferAttribute(_uvBuf.slice(0, ui),  2));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(idxBuf), 1));
  geo.computeVertexNormals();
  return geo;
}

async function loadTile(tx, ty, zoom) {
  const key = `${zoom}_${tx}_${ty}`;
  if (tileMeshes.has(key) || loadingTiles.has(key)) return;
  loadingTiles.add(key);
  const epoch = tileLoadEpoch, sig = tileLoadController.signal;
  const [geo, tex] = await Promise.all([
    buildMeshWithNeighbors(tx, ty, zoom, sig),
    loadSatTex(zoom, tx, ty, sig)
  ]);
  if (epoch !== tileLoadEpoch || sig.aborted) { loadingTiles.delete(key); return; }
  // MeshBasicMaterial – zero obliczeń oświetlenia per pixel (vs Lambert).
  // Teren i tak wygląda dobrze bo kolor pochodzi z tekstury SAT.
  const mat = new THREE.MeshBasicMaterial({
    map: tex || null,
    color: tex ? 0xffffff : 0x5a8a50,
  });
  const mesh = new THREE.Mesh(geo, mat);
  scene.add(mesh);
  tileMeshes.set(key, mesh);
  loadingTiles.delete(key);
}

// ─── Tile management ──────────────────────────────────────────────────────────
function getZoom() {
  return Math.max(7, Math.min(15, Math.round(Math.log2(150000000 / camDist))));
}

// Tile'y poprzedniego zooma – zostają w scenie jako fallback póki nowe się ładują
const oldTileMeshes = new Map();

// Debounce zmiany zooma – czekamy N klatek stabilnego zooma zanim zmienimy
let pendingZoom     = null;
let pendingZoomAge  = 0;
const ZOOM_DEBOUNCE_FRAMES = 8; // ~270ms przy 30fps update

function disposeMesh(mesh) {
  scene.remove(mesh);
  mesh.geometry.dispose();
  if (mesh.material.map) {
    const ck = satTextureCacheKeys.get(mesh.material.map);
    if (!ck || satTextureCache.get(ck) !== mesh.material.map)
      mesh.material.map.dispose();
  }
  mesh.material.dispose();
}

function clearOldTiles() {
  for (const mesh of oldTileMeshes.values()) disposeMesh(mesh);
  oldTileMeshes.clear();
}

function updateTiles() {
  const rawZoom = getZoom();

  // Debounce: zmień activeTileZoom dopiero gdy ten sam zoom utrzymuje się
  // przez ZOOM_DEBOUNCE_FRAMES klatek – eliminuje miganie przy szybkim scrollu
  if (rawZoom !== activeTileZoom) {
    if (rawZoom === pendingZoom) {
      pendingZoomAge++;
    } else {
      pendingZoom    = rawZoom;
      pendingZoomAge = 1;
    }

    if (pendingZoomAge >= ZOOM_DEBOUNCE_FRAMES) {
      // Zoom stabilny – przełącz
      tileLoadController.abort();
      tileLoadController = new AbortController();
      tileLoadEpoch++;
      loadingTiles.clear();
      // Stare tile'y → fallback (nadal widoczne w scenie)
      clearOldTiles();
      for (const [key, mesh] of tileMeshes) oldTileMeshes.set(key, mesh);
      tileMeshes.clear();
      activeTileZoom = rawZoom;
      pendingZoom    = null;
      pendingZoomAge = 0;
    }

    if (activeTileZoom === null) {
      activeTileZoom = rawZoom;
      pendingZoom    = null;
      pendingZoomAge = 0;
    } else if (activeTileZoom !== rawZoom) {
      return activeTileZoom; // czekamy na debounce
    }
  } else {
    pendingZoom    = null;
    pendingZoomAge = 0;
  }

  const zoom = activeTileZoom;
  const [cx, cy] = deg2tile(camLat, camLon, zoom);
  const n = 1 << zoom;

  // Usuń tile'y aktywnego zooma które wyszły za daleko
  for (const [key, mesh] of tileMeshes) {
    const [, kx, ky] = key.split('_').map(Number);
    if (Math.abs(kx - cx) > TILE_LOAD_RADIUS + 1 || Math.abs(ky - cy) > TILE_LOAD_RADIUS + 1) {
      disposeMesh(mesh); tileMeshes.delete(key);
    }
  }

  // Ładuj nowe tile'y
  for (let dy = -TILE_LOAD_RADIUS; dy <= TILE_LOAD_RADIUS; dy++)
    for (let dx = -TILE_LOAD_RADIUS; dx <= TILE_LOAD_RADIUS; dx++) {
      const tx = cx + dx, ty = cy + dy;
      if (tx >= 0 && ty >= 0 && tx < n && ty < n) loadTile(tx, ty, zoom);
    }

  // Usuń stare tile'y dopiero gdy CAŁY widoczny obszar nowego zooma jest załadowany
  if (oldTileMeshes.size > 0) {
    let allLoaded = true;
    outer: for (let dy = -TILE_LOAD_RADIUS; dy <= TILE_LOAD_RADIUS; dy++)
      for (let dx = -TILE_LOAD_RADIUS; dx <= TILE_LOAD_RADIUS; dx++) {
        const tx = cx + dx, ty = cy + dy;
        if (tx < 0 || ty < 0 || tx >= n || ty >= n) continue;
        if (!tileMeshes.has(`${zoom}_${tx}_${ty}`)) { allLoaded = false; break outer; }
      }
    if (allLoaded) clearOldTiles();
  }

  return zoom;
}

// ─── Teleport ─────────────────────────────────────────────────────────────────
function teleportTo(lat, lon, dist) {
  camLat = lat; camLon = lon; camDist = dist; camY = 0; camPitch = 45;
  tileLoadController.abort();
  tileLoadController = new AbortController();
  tileLoadEpoch++;
  activeTileZoom = null;
  loadingTiles.clear();
  clearOldTiles();
  for (const [, mesh] of tileMeshes) disposeMesh(mesh);
  tileMeshes.clear();
  clearAllBuildingTiles();
  lastBuildingTileKey = null;
}

// ─── Kamera ───────────────────────────────────────────────────────────────────
function applyCamera() {
  const R = 6371000, mid = refLat * Math.PI / 180;
  const p = camPitch * Math.PI / 180, y = camYaw * Math.PI / 180;
  const tx = (camLon - refLon) * Math.PI / 180 * R * Math.cos(mid);
  const ty = (camLat - refLat) * Math.PI / 180 * R;
  camera.position.set(
    tx + camDist * Math.cos(p) * Math.sin(y),
    camDist * Math.sin(p) + camY,
    -ty - camDist * Math.cos(p) * Math.cos(y)
  );
  camera.lookAt(tx, camY, -ty);
}

// ─── Sterowanie ───────────────────────────────────────────────────────────────
let mDown = false, rDown = false, lx = 0, ly = 0;
const keys = new Set();
const cv = document.getElementById('c');

cv.addEventListener('mousedown', e => {
  if (e.button === 0) mDown = true;
  if (e.button === 2) rDown = true;
  lx = e.clientX; ly = e.clientY;
  e.preventDefault();
});
window.addEventListener('mouseup', () => { mDown = false; rDown = false; });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d','q','e'].includes(k)) { keys.add(k); e.preventDefault(); }
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('mousemove', e => {
  const dx = e.clientX - lx, dy = e.clientY - ly;
  if (mDown) {
    camYaw += dx * 0.3;
    camPitch = Math.max(5, Math.min(89, camPitch + dy * 0.25));
  }
  if (rDown) {
    const R = 6371000, mid = refLat * Math.PI / 180;
    const spd = camDist / R * 180 / Math.PI * 0.003;
    const yr = camYaw * Math.PI / 180;
    camLon -= (Math.sin(yr) * dy - Math.cos(yr) * dx) * spd / Math.cos(mid);
    camLat -= (Math.cos(yr) * dy + Math.sin(yr) * dx) * spd;
  }
  lx = e.clientX; ly = e.clientY;
});
cv.addEventListener('wheel', e => {
  camDist = Math.max(500, Math.min(2500000, camDist * (1 + e.deltaY * 0.001)));
  e.preventDefault();
}, { passive: false });
cv.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Touch
let touches = {};
cv.addEventListener('touchstart', e => {
  [...e.changedTouches].forEach(t => touches[t.identifier] = { x: t.clientX, y: t.clientY });
  e.preventDefault();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  if (Object.keys(touches).length === 1) {
    const t = e.changedTouches[0];
    const dx = t.clientX - touches[t.identifier].x;
    const dy = t.clientY - touches[t.identifier].y;
    camYaw += dx * 0.3;
    camPitch = Math.max(5, Math.min(89, camPitch - dy * 0.25));
    touches[t.identifier] = { x: t.clientX, y: t.clientY };
  }
  e.preventDefault();
}, { passive: false });
cv.addEventListener('touchend', e => {
  [...e.changedTouches].forEach(t => delete touches[t.identifier]);
}, { passive: false });

// ─── Loop ─────────────────────────────────────────────────────────────────────
const hPos   = document.getElementById('h-pos');
const hAlt   = document.getElementById('h-alt');
const hTiles = document.getElementById('h-tiles');
let fc = 0, lastT = performance.now();

function updateKeyboard(dt) {
  const forward = (keys.has('s') ? 1 : 0) - (keys.has('w') ? 1 : 0);
  const strafe  = (keys.has('a') ? 1 : 0) - (keys.has('d') ? 1 : 0);
  const climb   = (keys.has('e') ? 1 : 0) - (keys.has('q') ? 1 : 0);
  if (!forward && !strafe && !climb) return;
  const R = 6371000, mid = refLat * Math.PI / 180;
  const yr = camYaw * Math.PI / 180;
  const base = Math.max(50, camDist * 0.0015);
  const hm = base * WASD_SPEED * dt;
  const vm = base * QE_SPEED * dt;
  const east  = (forward * Math.sin(yr) + strafe * Math.cos(yr)) * hm;
  const north = (forward * Math.cos(yr) - strafe * Math.sin(yr)) * hm;
  camLon += (east  / (R * Math.cos(mid))) * 180 / Math.PI;
  camLat += (north / R) * 180 / Math.PI;
  camY   += climb * vm;
}

function animate(t) {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t; fc++;
  updateKeyboard(dt);
  applyCamera();
  let z = activeTileZoom ?? getZoom();
  if (fc % 2 === 0)  z = updateTiles();
  if (fc % 10 === 0) void loadBuildings(camLat, camLon);
  if (fc % 30 === 0) {
    hPos.textContent   = `Lat: ${camLat.toFixed(4)}°  Lon: ${camLon.toFixed(4)}°`;
    hAlt.textContent   = `Dystans: ${Math.round(camDist / 1000)} km  |  Zoom: ${z}`;
    const totalB = [...buildingMeshes.values()].length;
    hTiles.textContent = `Tile'y: ${tileMeshes.size} załad., ${loadingTiles.size} ład. | Budynki: ${totalB} batched tiles (cache: ${buildingCache.size}/${BUILDINGS_DATA_CACHE_LIMIT})`;
  }
  renderer.render(scene, camera);
}

updateTiles();
animate();
</script>
