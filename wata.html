<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Przygotowanie pod API - Maskowanie Wody</title>
    <style>
        body {
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        canvas, img {
            border: 2px solid #fff;
            background: #000;
        }
    </style>
</head>
<body>

    <h2>Przygotowanie pod API: Maska Wody (Woda = Czarny, Ląd = Biały)</h2>
    <p>Używa kafelków Wikimedia (OpenStreetMap) z pełnym wsparciem dla CORS.</p>

    <div class="container">
        <div>
            <h3>1. Oryginalny Kafelek</h3>
            <!-- Kafelki Wikimedia mają włączony CORS, co pozwala na obróbkę pikseli lokalnie -->
            <img id="sourceImage" crossorigin="anonymous" src="https://wikimedia.org" width="256" height="256">
        </div>
        <div>
            <h3>2. Maska dla API (Wynik)</h3>
            <canvas id="outputCanvas" width="256" height="256"></canvas>
        </div>
    </div>

    <script>
        const img = document.getElementById('sourceImage');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d');

        img.onload = function() {
            // Narysuj oryginalny obrazek na płótnie
            ctx.drawImage(img, 0, 0);

            // Pobierz tablicę pikseli
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            // Kolor wody na mapach Wikimedia (RGB dla #aad3df / #aed6e2 to okolice tych wartości)
            const targetR = 174;
            const targetG = 214;
            const targetB = 226;
            const tolerance = 15; // Margines błędu dla antyaliasingu brzegów rzek

            // Pętla sprawdzająca piksele
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // Warunek sprawdzający, czy piksel to woda
                const isWater = Math.abs(r - targetR) < tolerance && 
                                Math.abs(g - targetG) < tolerance && 
                                Math.abs(b - targetB) < tolerance;

                if (isWater) {
                    // WODA -> CZARNY PIKSEL
                    data[i] = 0;     // R
                    data[i + 1] = 0; // G
                    data[i + 2] = 0; // B
                } else {
                    // LĄD / BUDYNKI / NAPISY -> BIAŁY PIKSEL
                    data[i] = 255;   // R
                    data[i + 1] = 255;// G
                    data[i + 2] = 255;// B
                }
                // Alfa (przezroczystość) zostaje bez zmian (255 - w pełni widoczny)
                data[i + 3] = 255; 
            }

            // Nadpisz płótno przetworzonymi pikselami
            ctx.putImageData(imgData, 0, 0);
        };

        if (img.complete) img.onload();
    </script>

</body>
</html>
